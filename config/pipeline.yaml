# Nepal Trek Film Pipeline — all tunables in one place.
# Every value that the spec states as a number lives here, not in code.

project:
  name: nepal
  # The delivered media tree. Absolute, so it is unambiguous.
  data_root: /data/projects/nepal_data
  # Derived artefacts: proxies, yaw views, sampled frames, audio, reports.
  # Kept on the same volume as the media rather than inside the repository,
  # because S03 writes a 540p equirect proxy plus four rectilinear yaw views
  # and a 16 kHz audio track for every recording -- on the order of 10-15 GB
  # for 4.9 hours of footage, which does not belong on a system disk.
  work_root: /data/projects/nepal_work
  db_path: /data/projects/nepal_work/db/nepal.sqlite

aws:
  region: eu-north-1
  bucket: nepal
  # --proxy-only ingest mode (spec section 9): upload .lrv instead of .insv.
  proxy_only: false

film:
  # The film aims for the target and moves either way as the material warrants.
  # Twenty minutes is the length the creative brief was written for, so a longer
  # cut has to earn it rather than happen by default -- but the target is not a
  # cap, and it is not a floor either. Where the material will not carry twenty
  # minutes, fifteen is a better film than twenty padded out.
  min_duration_s:  900           # 15 min -- shorter than this is not the film
  target_duration_s: 1200        # 20 min -- what it aims for
  max_duration_s: 2400           # 40 min -- hard ceiling
  short_duration_s: 180          # the 3 min cut
  shot_count_min: 150
  shot_count_max: 200
  duration_tolerance_s: 30
  # How readily the film grows past the target. 0 pins it at the target
  # regardless of material; 1 extends to whatever the material supports. Low by
  # design -- surplus footage is a weak reason to make a film longer.
  growth_bias: 0.35
  # The film is motion; stills are punctuation. This is the share of each act's
  # runtime that photographs may occupy -- applied per act, so it cannot pool
  # into one place and turn Act 1 into a slideshow. Only the best stills compete
  # for it; they are never ranked against footage, which they would either lose
  # to everywhere or beat unfairly (a photograph wins every stability contest by
  # not moving).
  photo_share: 0.10
  # Per-act overrides. Act 4 is the one worth a deliberate decision: the brief
  # makes it one swell into a hard cut to silence. Set it to 0.0 to keep stills
  # out of the summit entirely.
  photo_share_by_act: {}
  # The pre-title sequence: 15-25 s from Act 3 or 4, then a hard cut to a title
  # card. Carved off the top, so the acts are allocated over the remainder. This
  # is the one deliberate break in chronology.
  cold_open_s: 20
  # How much keepable footage a minute of finished film is cut from. The film
  # counts nothing as surplus until it has this many times its own length in
  # shots that survive the quality gate.
  material_selectivity: 3.0

# Act allocation. target_s is where each act sits at the 20-minute target and
# sums to it; min_s and max_s bound how far it may move as the total changes.
#
# The bounds are deliberately asymmetric. Acts 2, 3 and 5 are the journey and
# absorb almost all of any extra length. Act 4 barely moves: the brief describes
# it as a peak swell and a hard cut to silence, which is a beat rather than a
# phase, and at 45 minutes a linear share would make it four minutes long --
# no longer the single most powerful move in the film but a section of it.
# Act 1 is capped too; beyond about five minutes, Telegram screenshots drag
# however good they are.
# Act 1 is half what it was. Nearly three minutes of planning before anything
# happens is a long time to ask for in a twenty-minute film, and it is the
# thinnest act in the corpus -- seventeen pre-trek clips and sixty-two
# photographs across two and a half months. The time moves to Act 5, which is no
# longer only the descent: "walked down" is not an ending, and the return
# through Kathmandu, the Delhi layover and the flight home is a better one.
acts:
  - {act: 1, name: Planning,          target_s:  83, min_s:  45, max_s:  180}
  - {act: 2, name: Approach,          target_s: 287, min_s: 150, max_s:  700}
  - {act: 3, name: Climb,             target_s: 407, min_s: 240, max_s: 1150}
  - {act: 4, name: Highest point,     target_s: 113, min_s:  90, max_s:  150}
  - {act: 5, name: Descent and return, target_s: 311, min_s: 150, max_s:  700}

probe:
  # S01.4 fisheye FOV auto-solve
  fov:
    candidates_start: 188
    candidates_stop: 208      # exclusive, matches range(188, 208, 2)
    candidates_step: 2
    sample_frames: 20
    min_distinct_files: 8
    seam_band_px: 6
    local_band_px: 60
    min_confidence: 0.05
    fallback_deg: 193
  # S01.5 clock offset auto-solve (GCC-PHAT)
  clock:
    pair_window_s: 600        # +/- 10 min nominal overlap to consider a pair
    max_lag_s: 600            # +/- 10 min search window
    sample_rate: 16000
    max_audio_s: 120
    min_pair_confidence: 1.5
    min_confident_pairs: 3
    # Stage 1: bulk offset from capture-activity histograms, for a device whose
    # clock is days out (a flat battery resets an action camera's clock).
    coarse_bin_s: 3600
    coarse_max_offset_s: 3888000     # 45 days
  # S01.2 chapter grouping acceptance
  max_chapter_gap_s: 1.0

spine:
  # Reference data. Both are optional: absent, altitude and place names stay
  # null and the stage reports it rather than failing.
  srtm_dir: ./data/srtm             # SRTM .hgt tiles (see tools/fetch_reference.py)
  geonames_path: ./data/geonames/NP.txt
  # S02.2 refuse to interpolate across gaps longer than this
  max_interp_gap_s: 14400     # 4 hours
  # S02.4 cluster distinct locations to ~500 m before reverse geocoding
  geocode_cluster_m: 500
  # Act boundaries. The trek is the densest run of days with material; days
  # separated by more than max_gap_days start a new run. Act 1 reaches back to
  # the first planning material and Act 5 forward to the homecoming, both
  # bounded -- without a bound, one mis-timestamped clip turns Act 5 into a
  # 566-day act.
  # Points further than this from the median position are not on the trek, so
  # they are excluded from the envelope that classifies message phase. Generous
  # enough to keep the trailhead city: Kathmandu is ~110 km from Manaslu.
  trek_radius_km: 200
  act_max_gap_days: 3
  act_planning_window_days: 180
  act_after_window_days: 30
  # S02.5 message classification
  notable_window_s: 1200      # 20 min around an altitude-gain local max
  card_max_chars: 180         # "short, self-contained, quotable"
  # S02.6
  whisper_model: large-v3
  whisper_language: ru        # OPEN QUESTION 3 — confirm
  # S02.7
  music_segments: 8
  swell_percentile: 75

process:
  # -- S03.0 stills ---------------------------------------------------
  # Photographs are decoded at this size for the sharpness and exposure
  # measures -- full resolution changes the numbers very little and costs a
  # great deal on seven hundred files.
  photo_analysis_px: 1024
  # How long a still is held before S06 snaps it to the beat grid. Long enough
  # to read, short enough not to stall the cut; a panorama earns 25% longer.
  photo_slot_s: 3.0
  # Threads for decoding. libheif releases the GIL and decoding dominates the
  # cost, so this scales very nearly linearly -- 3.7x on four cores, with
  # identical measurements. 0 means one per core.
  photo_workers: 0

  # -- S03.1 proxies --------------------------------------------------
  # Proxy frame rate. Shot detection and metric sampling do not need thirty
  # frames a second, and v360 is the whole cost of S03.1, so halving the frames
  # halves the pass. 0 keeps the source rate.
  proxy_fps: 15
  # x264 preset for proxies. These are watched by a scene detector and sampled
  # for metrics, never delivered, so encoding effort buys nothing: measured 3.9s
  # at medium against 1.9s at veryfast for the same clip and the same file size.
  encoder_preset: veryfast
  # The equirect proxy. Its only consumers are shot detection and metric
  # sampling -- the Gate 3 draft renders 360 material from yaw views, not from
  # this -- so 640x320 is a legitimate trade if v360 is taking too long. It is
  # the one remaining lever on S03.1's cost.
  proxy_size: [1024, 512]
  flat_proxy_size: [960, 540]
  # Phase A writes the equirect proxy and audio only: 3.46x realtime against
  # 0.73x for the specification's single pass, because each of the four
  # rectilinear branches re-resamples the whole frame. S05 needs one yaw per
  # surviving shot, not four per recording, so those are rendered as stills
  # later. Set true to reproduce the single-pass design.
  yaw_videos: false
  # A pass running many times longer than its own footage is wedged, not slow.
  # Bounded so one bad file reports itself and the rest of the corpus still runs.
  ffmpeg_timeout_factor: 20
  ffmpeg_min_timeout_s: 300

  # -- S03.2 shot detection -------------------------------------------
  # PySceneDetect ContentDetector (spec section S03.2).
  scene_threshold: 27.0
  min_shot_s: 1.5
  # A 360 camera on a walking person does not cut: 395 of 480 recordings came
  # back with no detected boundary at all, one of them 29 minutes long. A shot
  # is what the timeline chooses between and what a metric describes, and
  # neither survives that length, so anything longer is divided into equal
  # pieces of about this size. 0 disables the division.
  max_shot_s: 20.0

  # -- S03.3 technical metrics ----------------------------------------
  # Sample points per shot. Five is the spec; each costs one seek plus three
  # decoded frames, so the whole corpus is minutes, not hours.
  metric_samples_per_shot: 5
  # Frames read at each sample point. Three gives two consecutive flow fields,
  # and it is the CHANGE between them -- the jerk -- that separates a shaky
  # clip from one that is merely moving. Two frames cannot tell those apart.
  metric_frames_per_sample: 3
  # Flow is computed at this width. Farneback cost is per-pixel and shake is a
  # low-frequency signal; measuring it at proxy resolution buys nothing.
  metric_flow_px: 320
  # Jerk, in pixels per frame squared at metric_flow_px, at which a shot scores
  # half stable. A calibration point, not a law, and the first guess (4.0)
  # was an order of magnitude high: measured on this corpus, camera shots
  # sit at p50 0.24 px, p90 0.83, p99 1.87; phones at p50 0.07, p95 0.49.
  # Nothing here oscillates -- the Insta360's single-lens mode and both
  # phones stabilise in camera -- so what jerk actually catches is the camera
  # being swung. The worst shot (3.5 px) is a camera at knee height pointed
  # at boots; at 1.9 px it is a tilted, drifting but usable frame. With the
  # camera floor at 0.35 this puts the cut at ~2.2 px: the swings go, the
  # drifts stay for S05 to rank. Applied at gate time from the stored jerk,
  # so moving it is a `nepal s03` re-run, not a re-measure.
  metric_jerk_ref_px: 1.2
  # Threads for sampling. Decoding releases the GIL. 0 means one per core.
  metric_workers: 0

  # -- S03.4 audio ----------------------------------------------------
  # Wind: a shot whose energy below the cutoff exceeds this share of the total
  # is roaring, not recording. The share is stored per shot and the flag
  # derived at gate time, so this can move without a re-measure.
  wind_lf_ratio: 0.80
  wind_lf_cutoff_hz: 200
  # Speech: seconds of silero-VAD speech inside the shot before has_speech is
  # set. A syllable clipped at a shot boundary is not speech the film can use;
  # the gate's reprieve and S03.5's transcription both hang on this flag.
  speech_min_s: 0.6
  # VAD run once per recording, not per shot, so a sentence survives the shot
  # detector's boundaries. Silence shorter than this joins the segments either
  # side; the pad keeps the first and last phoneme.
  vad_min_silence_ms: 500
  vad_pad_ms: 200
  # Threads for S03.4. Each shot is one ffmpeg call for loudness; the VAD is
  # one onnxruntime pass per recording. 0 means one per core.
  audio_workers: 0

  # -- S03.5 transcription --------------------------------------------
  # Model and language are spine.whisper_model / spine.whisper_language, the
  # same as S02.6. Beam width is the main speed lever on a CPU: 5 is
  # faster-whisper's default and what S02.6 used; 1 is several times faster
  # and noticeably worse on wind-blown speech. 0 threads means the library's
  # own default.
  asr_beam_size: 5
  asr_cpu_threads: 0

  # -- S03.6 faces ----------------------------------------------------
  # Faces are read from rectilinear views, never the equirect: measured on
  # this corpus, the same face embedded both ways agreed at 0.87-0.96 cosine
  # except for one pair at 0.50 -- far enough apart that the face would not
  # cluster with itself -- and the equirect seam tears a face in two. It
  # costs nothing: the detector resizes everything to its own input, so four
  # yaw views took 16.0 s against the equirect frame's 16.5 s.
  face_yaws: [0, 90, 180, 270]
  face_view_fov_deg: 90
  face_view_px: 640
  # Fewer sample points than the metrics use. A face is a fact about the shot,
  # not a distribution over it -- if someone is in frame, two looks find them,
  # and this stage is the most expensive per frame in the pipeline.
  face_samples_per_shot: 2
  # Below this the detector is usually finding a rucksack buckle or lichen.
  # Low, because this corpus is faces at distance under hoods.
  face_min_det_score: 0.55
  # Cosine above which two embeddings are the same person. Generous on
  # purpose: a face that fails to cluster costs a shot its subject, while a
  # cluster that merges two people is visible at Gate 2 and fixable there.
  face_same_person_cos: 0.42
  # Cosine between two cluster MEANS above which they are one person. The
  # greedy pass splits a person whose pose changes -- on this corpus keller
  # came back as 376 + 65 + 25 faces and kulikov as 200 + 33, with means
  # 0.48-0.78 apart while strangers sat at 0.00-0.12. Merging at 0.40 put
  # them back together (482 and 264) and left every other pair below 0.12.
  # The gap is wide, so anything from 0.35 to 0.45 gives the same answer.
  face_merge_cos: 0.40
  face_model: buffalo_l
  # Set true only where a CUDA device exists; the account this ran on had no
  # GPU quota at all and an 8-core CPU box was enough.
  face_gpu: false
  face_workers: 0

# S03.7 quality gate -- one curve per source class (spec section S03.7).
#
# max_exposure_pen is far above the spec's 0.15 / 0.20 / 0.35. Those were
# written before anyone had seen the corpus, and exposure_pen -- the share of
# pixels clipped at either end -- measures a scene's contrast range, not an
# exposure failure. At the spec's values the rule rejected 30 video shots,
# and every one of them was picture: 22 were talking-to-camera diary selfies
# with a white sky behind a correctly exposed face (the section 1.4 spine),
# three were a teahouse at night, two were Telegram round videos. The frames
# that are genuinely nothing -- five recordings shot inside a bag -- sit at
# 1.0. The ceiling now separates those from everything else and leaves
# "too much sky" to S05. For telegram it is off (1.0 can never be exceeded):
# the Act 1 material is screenshots -- the itinerary, the e-visa, the flight,
# the budget -- and a screenshot is white by nature. A blank one is caught
# by the sharpness floor, which is what blankness actually is.
quality_curves:
  camera:   {min_sharpness: 4.0, max_exposure_pen: 0.60, min_stability: 0.35, min_duration_s: 1.5}
  phone:    {min_sharpness: 3.5, max_exposure_pen: 0.60, min_stability: 0.30, min_duration_s: 1.5}
  telegram: {min_sharpness: 2.0, max_exposure_pen: 1.00, min_stability: 0.15, min_duration_s: 1.0}

# A shot carrying speech is judged on a floor of its own: the spec makes voice
# the spine of the film (section 1.4), and a soft frame under a good sentence is
# worth more than a sharp frame of nothing. Applied only where has_speech = 1.
gate:
  speech_sharpness_factor: 0.6
  speech_min_duration_s: 1.0

semantic:
  max_caption_shots: 2500     # THE ONLY UNBOUNDED COST — spec section 8.1
  frames_per_caption: 4
  bedrock_model: null         # set at deploy time
  clip_model: ViT-L-14
  clip_pretrained: openai
  # CPU is a first-class path: the account this ran on had no GPU quota at all.
  # The claim that once stood here -- "ViT-L embeds this corpus in minutes on
  # eight cores" -- was never measured and is wrong. Measured on 4 cores:
  # 14.8 s/shot, i.e. 7 hours for 1,632 shots, and that was with torch
  # silently using 2 threads on a machine 6 GB into swap.
  clip_gpu: false
  clip_batch: 16
  # torch picks a thread count that is not the machine's core count. 0 = all.
  clip_threads: 0

score:
  tech:  {sharpness: 0.35, exposure: 0.25, stability: 0.30, duration_fit: 0.10}
  sem:   {vlm_interest: 0.60, clip_act_sim: 0.40}
  ctx:   {has_face: 0.25, has_speech: 0.20, new_max_alt: 0.20, first_at_place: 0.20, msg_proximity: 0.15}
  total: {tech: 0.40, sem: 0.35, ctx: 0.25}
  duration_fit_peak_s: [4.0, 8.0]
  shortlist_size: 400
  min_per_act: 40

assemble:
  mmr_lambda: 0.30
  max_shots_per_place_per_act: 3
  subject_shot_every_s: 40
  levity_min_per_act: 1        # acts 2-5, hard constraint
  shot_duration_s:
    1: [3.0, 5.0]
    2: [4.0, 6.0]
    3: [3.0, 8.0]
    4: [2.0, 4.0]
    5: [5.0, 8.0]
  act4_held_shot_s: [6.0, 10.0]
  # A hard cut to silence needs room to land; three seconds is a gap, five is a
  # held breath.
  silence_window_s: 5.0
  # Music-out windows: no music at all, original audio at full level, placed at
  # the highest-exertion moments S05 finds. At -14 LUFS music with everything
  # ducked to -28 under it, location sound is inaudible for the whole runtime --
  # which throws away breathing at five thousand metres, wind, boots on scree.
  natural_sound_windows: 4
  natural_sound_window_s: [10.0, 20.0]
  max_reassembly_loops: 3

render:
  draft: {width: 960, height: 540, crf: 23}
  music_lufs: -14.0            # the music bed
  duck_lufs: -28.0             # location audio under the bed
  duck_lufs_speech: -22.0      # music under speech

music:
  # How long one piece may play before the film moves to another. Without a cap
  # a long track swallows its act -- a 9-minute one covered the whole 6.8-minute
  # Climb, leaving the centre of the film on a single cue while 19 other tracks
  # went unused. An act shorter than this stays in one piece, so Act 4 keeps the
  # unbroken swell into the silence that the brief asks for.
  max_segment_s: 150
  license_mode: personal       # personal | cleared
  # Source of track features: audio files in music/, or a playlist export.
  # Audio is strictly better: it yields real beat grids and swells (which S06
  # needs to snap cuts) and real dynamic range, which Act 3's target leans on
  # and which no playlist export provides.
  source: audio                # audio | playlist | auto
  playlist_csv: null           # path; null means "the only .csv under music/"
  # To exclude a track, take it out of music/. The folder is the source of
  # truth; a name-matching filter here only risked dropping the wrong thing
  # (Aria, Pilot, Bravo, Kino and Husky are all names of unrelated bands).
  # Optional: drop tracks below this Spotify instrumentalness (playlist source
  # only -- an mp3 carries no such field). Off by default.
  min_instrumentalness: null
  # One track held back for the end credits (spec section S07.2). It is
  # withdrawn before the act assignment runs, not filtered out afterwards: left
  # in the pool it wins an act on its features, and that act is then scored
  # against a cue that will never play there. Matched on file name, stem or
  # title; a name that matches nothing is a warning, never a silent no-op.
  credits_track: "Marusha.Somewhere over the Rainbow.mp3"
