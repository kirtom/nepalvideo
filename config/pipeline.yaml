# Nepal Trek Film Pipeline — all tunables in one place.
# Every value that the spec states as a number lives here, not in code.

project:
  name: nepal
  # The delivered media tree. Absolute, so it is unambiguous.
  data_root: /data/projects/nepal_data
  # Derived artefacts: proxies, yaw views, sampled frames, audio, reports.
  # Kept on the same volume as the media rather than inside the repository,
  # because S03 writes a 540p equirect proxy plus four rectilinear yaw views
  # and a 16 kHz audio track for every recording -- on the order of 10-15 GB
  # for 4.9 hours of footage, which does not belong on a system disk.
  work_root: /data/projects/nepal_work
  db_path: /data/projects/nepal_work/db/nepal.sqlite

aws:
  region: eu-north-1
  bucket: nepal
  # --proxy-only ingest mode (spec section 9): upload .lrv instead of .insv.
  proxy_only: false

film:
  # The film aims for the target and moves either way as the material warrants.
  # Section 13.11.5 moved the target from twenty minutes to twenty-five: draft
  # feedback (2026-09-18) called 25-40 fine, so a longer cut no longer has to
  # fight the target to exist -- but the target is still not a cap, and it is
  # not a floor either. Where the material will not carry twenty-five minutes,
  # fifteen is a better film than twenty-five padded out.
  min_duration_s:  900           # 15 min -- shorter than this is not the film
  target_duration_s: 1500        # 25 min (section 13.11.5); max_duration_s stays 2400
  max_duration_s: 2400           # 40 min -- hard ceiling
  short_duration_s: 180          # the 3 min cut
  shot_count_min: 150
  shot_count_max: 200
  duration_tolerance_s: 30
  # How readily the film grows past the target. 0 pins it at the target
  # regardless of material; 1 extends to whatever the material supports.
  # Raised alongside the target (section 13.11.5): a film aiming for 25
  # minutes and tolerating up to 40 can afford to grow on strong material,
  # where the old 20-minute target could not.
  growth_bias: 0.6
  # The film is motion; stills are punctuation. This is the share of each act's
  # runtime that photographs may occupy -- applied per act, so it cannot pool
  # into one place and turn Act 1 into a slideshow. Only the best stills compete
  # for it; they are never ranked against footage, which they would either lose
  # to everywhere or beat unfairly (a photograph wins every stability contest by
  # not moving).
  photo_share: 0.10
  # Per-act overrides. Act 4 is the one worth a deliberate decision: the brief
  # makes it one swell into a hard cut to silence. Set it to 0.0 to keep stills
  # out of the summit entirely.
  # 2026-09-24, on the first draft: Acts 1 and 2 run out of clips -- 54 of
  # act 1's 82 surviving rows are stills, and holding them to a tenth of the
  # act means the same few videos come round again. Three tenths is what the
  # material is.
  photo_share_by_act: {1: 0.3, 2: 0.3}
  # The pre-title sequence: 15-25 s from Act 3 or 4, then a hard cut to a title
  # card. Carved off the top, so the acts are allocated over the remainder. This
  # is the one deliberate break in chronology.
  cold_open_s: [15, 25]          # replaces the dead scalar
  # The title card's caption, over the cut from cold open to Act 1 -- "three
  # months earlier".
  cold_open_card: "тремя месяцами ранее"
  # How much keepable footage a minute of finished film is cut from. The film
  # counts nothing as surplus until it has this many times its own length in
  # shots that survive the quality gate.
  material_selectivity: 3.0

# Act allocation. target_s is where each act sits at the 20-minute target and
# sums to it; min_s and max_s bound how far it may move as the total changes.
#
# The bounds are deliberately asymmetric. Acts 2, 3 and 5 are the journey and
# absorb almost all of any extra length. Act 4 barely moves: the brief describes
# it as a peak swell and a hard cut to silence, which is a beat rather than a
# phase, and at 45 minutes a linear share would make it four minutes long --
# no longer the single most powerful move in the film but a section of it.
# Act 1 is capped too; beyond about five minutes, Telegram screenshots drag
# however good they are.
# Act 1 is half what it was. Nearly three minutes of planning before anything
# happens is a long time to ask for in a twenty-minute film, and it is the
# thinnest act in the corpus -- seventeen pre-trek clips and sixty-two
# photographs across two and a half months. The time moves to Act 5, which is no
# longer only the descent: "walked down" is not an ending, and the return
# through Kathmandu, the Delhi layover and the flight home is a better one.
acts:
  - {act: 1, name: Planning,          target_s:  83, min_s:  45, max_s:  180}
  - {act: 2, name: Approach,          target_s: 287, min_s: 150, max_s:  700}
  # 2026-09-24: the operator has material to spare in the climb and would
  # rather the film spent it there than anywhere else; 1150 -> 1400.
  - {act: 3, name: Climb,             target_s: 407, min_s: 240, max_s: 1400}
  - {act: 4, name: Highest point,     target_s: 113, min_s:  90, max_s:  150}
  - {act: 5, name: Descent and return, target_s: 311, min_s: 150, max_s:  700}

probe:
  # S01.4 fisheye FOV auto-solve
  fov:
    candidates_start: 188
    candidates_stop: 208      # exclusive, matches range(188, 208, 2)
    candidates_step: 2
    sample_frames: 20
    min_distinct_files: 8
    seam_band_px: 6
    local_band_px: 60
    min_confidence: 0.05
    fallback_deg: 193
  # S01.5 clock offset auto-solve (GCC-PHAT)
  clock:
    pair_window_s: 600        # +/- 10 min nominal overlap to consider a pair
    max_lag_s: 600            # +/- 10 min search window
    sample_rate: 16000
    max_audio_s: 120
    min_pair_confidence: 1.5
    min_confident_pairs: 3
    # Stage 1: bulk offset from capture-activity histograms, for a device whose
    # clock is days out (a flat battery resets an action camera's clock).
    coarse_bin_s: 3600
    coarse_max_offset_s: 3888000     # 45 days
    # The operator's word at Gate 1, per source, in seconds; a device named
    # here is not solved. The camera: the solver said +18.00 d from an audio
    # match on 3 of 60 pairs, and its own histogram offered +14.00 d twice.
    # The clips decide it -- "Подготовка к выезду... Шереметьево" is
    # departure day (27 Apr, file says 13 Apr), the monastery 250 m above
    # Samagaon is 3 May (file says 19 Apr), "Сейчас попиздуем на перевал"
    # is the eve of the pass (5 May, file says 21 Apr): +14 days, every time.
    offset_overrides_s:
      camera: 1209600                # +14.00 d
  # S01.2 chapter grouping acceptance
  max_chapter_gap_s: 1.0
  # Directories under data_root that are not media. The Strava export is read
  # by S02.1 directly; walked by the manifest it would become 12 "assets".
  exclude_dirs: [strava]
  # Files that are not media wherever they sit: an installer, the thumbnail
  # Telegram writes beside every PDF, a spreadsheet lock file.
  ignore_globs: ["*.zip", "*_thumb.jpg", ".~lock*"]
  # A capture time the operator knows and the file does not, by file name.
  # Three phone clips on this corpus carry only an export date (2025-11-22),
  # and no clock offset can recover a time that was never recorded.
  #   video_1_902aaa.mp4: "2024-05-12T09:30:00+05:45"
  capture_time_overrides: {}

spine:
  # Reference data. Both are optional: absent, altitude and place names stay
  # null and the stage reports it rather than failing.
  srtm_dir: ./data/srtm             # SRTM .hgt tiles (see tools/fetch_reference.py)
  geonames_path: ./data/geonames/NP.txt
  # S02.2 refuse to interpolate across gaps longer than this
  max_interp_gap_s: 14400     # 4 hours
  # S02.4 cluster distinct locations to ~500 m before reverse geocoding
  geocode_cluster_m: 500
  # Act boundaries. The trek is the densest run of days with material; days
  # separated by more than max_gap_days start a new run. Act 1 reaches back to
  # the first planning material and Act 5 forward to the homecoming, both
  # bounded -- without a bound, one mis-timestamped clip turns Act 5 into a
  # 566-day act.
  # Points further than this from the median position are not on the trek, so
  # they are excluded from the envelope that classifies message phase. Generous
  # enough to keep the trailhead city: Kathmandu is ~110 km from Manaslu.
  trek_radius_km: 200
  act_max_gap_days: 3
  act_planning_window_days: 180
  act_after_window_days: 30
  # S02.5 message classification
  notable_window_s: 1200      # 20 min around an altitude-gain local max
  card_max_chars: 180         # "short, self-contained, quotable"
  # S02.6
  whisper_model: large-v3
  whisper_language: ru        # confirmed by the operator, 2026-09-16: Russian natives
  # S02.1 Strava. One FIT file per trekking day from an Apple Watch: a fix a
  # second, barometric altitude, heart rate. Sampled to this spacing on the
  # way in -- one fix in five seconds is 56k points for the trek, which the
  # interpolation handles in milliseconds; one a second is five times that
  # for nothing the film can see.
  strava_dir: strava
  strava_sample_s: 5
  # Summits the film may label in the frame (Film v2 section 13.3).
  # Coordinates from GeoNames; altitude in metres.
  named_peaks:
    - {name: Manaslu, lat: 28.5497, lon: 84.5597, alt_m: 8163}
  # S02.7
  music_segments: 8
  swell_percentile: 75

process:
  # -- S03.0 stills ---------------------------------------------------
  # Photographs are decoded at this size for the sharpness and exposure
  # measures -- full resolution changes the numbers very little and costs a
  # great deal on seven hundred files.
  photo_analysis_px: 1024
  # How long a still is held before S06 snaps it to the beat grid. Long enough
  # to read, short enough not to stall the cut; a panorama earns 25% longer.
  photo_slot_s: 3.0
  # Threads for decoding. libheif releases the GIL and decoding dominates the
  # cost, so this scales very nearly linearly -- 3.7x on four cores, with
  # identical measurements. 0 means one per core.
  photo_workers: 0
  # While a photograph is decoded for its metrics, a JPEG of it is written to
  # work/stills/ at this size and the renderer reads that, not the original.
  # Whether ffmpeg opens HEIC depends on its build: the box's Ubuntu 4.4
  # refused every iPhone still and the draft died on the first. 1920 is
  # enough for the 1080p deliverable; conform re-reads the original.
  still_px: 1920

  # -- S03.1 proxies --------------------------------------------------
  # Proxy frame rate. Shot detection and metric sampling do not need thirty
  # frames a second, and v360 is the whole cost of S03.1, so halving the frames
  # halves the pass. 0 keeps the source rate.
  proxy_fps: 15
  # x264 preset for proxies. These are watched by a scene detector and sampled
  # for metrics, never delivered, so encoding effort buys nothing: measured 3.9s
  # at medium against 1.9s at veryfast for the same clip and the same file size.
  encoder_preset: veryfast
  # The equirect proxy. Its only consumers are shot detection and metric
  # sampling -- the Gate 3 draft renders 360 material from yaw views, not from
  # this -- so 640x320 is a legitimate trade if v360 is taking too long. It is
  # the one remaining lever on S03.1's cost.
  proxy_size: [1024, 512]
  flat_proxy_size: [960, 540]
  # Phase A writes the equirect proxy and audio only: 3.46x realtime against
  # 0.73x for the specification's single pass, because each of the four
  # rectilinear branches re-resamples the whole frame. S05 needs one yaw per
  # surviving shot, not four per recording, so those are rendered as stills
  # later. Set true to reproduce the single-pass design.
  yaw_videos: false
  # A pass running many times longer than its own footage is wedged, not slow.
  # Bounded so one bad file reports itself and the rest of the corpus still runs.
  ffmpeg_timeout_factor: 20
  ffmpeg_min_timeout_s: 300

  # -- S03.2 shot detection -------------------------------------------
  # PySceneDetect ContentDetector (spec section S03.2).
  scene_threshold: 27.0
  min_shot_s: 1.5
  # A 360 camera on a walking person does not cut: 395 of 480 recordings came
  # back with no detected boundary at all, one of them 29 minutes long. A shot
  # is what the timeline chooses between and what a metric describes, and
  # neither survives that length, so anything longer is divided into equal
  # pieces of about this size. 0 disables the division.
  max_shot_s: 20.0

  # -- S03.3 technical metrics ----------------------------------------
  # Sample points per shot. Five is the spec; each costs one seek plus three
  # decoded frames, so the whole corpus is minutes, not hours.
  metric_samples_per_shot: 5
  # Frames read at each sample point. Three gives two consecutive flow fields,
  # and it is the CHANGE between them -- the jerk -- that separates a shaky
  # clip from one that is merely moving. Two frames cannot tell those apart.
  metric_frames_per_sample: 3
  # Flow is computed at this width. Farneback cost is per-pixel and shake is a
  # low-frequency signal; measuring it at proxy resolution buys nothing.
  metric_flow_px: 320
  # Jerk, in pixels per frame squared at metric_flow_px, at which a shot scores
  # half stable. A calibration point, not a law, and the first guess (4.0)
  # was an order of magnitude high: measured on this corpus, camera shots
  # sit at p50 0.24 px, p90 0.83, p99 1.87; phones at p50 0.07, p95 0.49.
  # Nothing here oscillates -- the Insta360's single-lens mode and both
  # phones stabilise in camera -- so what jerk actually catches is the camera
  # being swung. The worst shot (3.5 px) is a camera at knee height pointed
  # at boots; at 1.9 px it is a tilted, drifting but usable frame. With the
  # camera floor at 0.35 this puts the cut at ~2.2 px: the swings go, the
  # drifts stay for S05 to rank. Applied at gate time from the stored jerk,
  # so moving it is a `nepal s03` re-run, not a re-measure.
  metric_jerk_ref_px: 1.2
  # Threads for sampling. Decoding releases the GIL. 0 means one per core.
  metric_workers: 0

  # -- S03.4 audio ----------------------------------------------------
  # Wind: a shot whose energy below the cutoff exceeds this share of the total
  # is roaring, not recording. The share is stored per shot and the flag
  # derived at gate time, so this can move without a re-measure.
  wind_lf_ratio: 0.80
  wind_lf_cutoff_hz: 200
  # Speech: seconds of silero-VAD speech inside the shot before has_speech is
  # set. A syllable clipped at a shot boundary is not speech the film can use;
  # the gate's reprieve and S03.5's transcription both hang on this flag.
  speech_min_s: 0.6
  # VAD run once per recording, not per shot, so a sentence survives the shot
  # detector's boundaries. Silence shorter than this joins the segments either
  # side; the pad keeps the first and last phoneme.
  vad_min_silence_ms: 500
  vad_pad_ms: 200
  # Threads for S03.4. Each shot is one ffmpeg call for loudness; the VAD is
  # one onnxruntime pass per recording. 0 means one per core.
  audio_workers: 0

  # -- S03.5 transcription --------------------------------------------
  # Model and language are spine.whisper_model / spine.whisper_language, the
  # same as S02.6. Beam width is the main speed lever on a CPU: 5 is
  # faster-whisper's default and what S02.6 used; 1 is several times faster
  # and noticeably worse on wind-blown speech. 0 threads means the library's
  # own default.
  asr_beam_size: 5
  asr_cpu_threads: 0

  # -- S03.6 faces ----------------------------------------------------
  # Faces are read from rectilinear views, never the equirect: measured on
  # this corpus, the same face embedded both ways agreed at 0.87-0.96 cosine
  # except for one pair at 0.50 -- far enough apart that the face would not
  # cluster with itself -- and the equirect seam tears a face in two. It
  # costs nothing: the detector resizes everything to its own input, so four
  # yaw views took 16.0 s against the equirect frame's 16.5 s.
  face_yaws: [0, 90, 180, 270]
  face_view_fov_deg: 90
  face_view_px: 640
  # Fewer sample points than the metrics use. A face is a fact about the shot,
  # not a distribution over it -- if someone is in frame, two looks find them,
  # and this stage is the most expensive per frame in the pipeline.
  face_samples_per_shot: 2
  # Below this the detector is usually finding a rucksack buckle or lichen.
  # Low, because this corpus is faces at distance under hoods.
  face_min_det_score: 0.55
  # Cosine above which two embeddings are the same person. Generous on
  # purpose: a face that fails to cluster costs a shot its subject, while a
  # cluster that merges two people is visible at Gate 2 and fixable there.
  face_same_person_cos: 0.42
  # Cosine between two cluster MEANS above which they are one person. The
  # greedy pass splits a person whose pose changes -- on this corpus keller
  # came back as 376 + 65 + 25 faces and kulikov as 200 + 33, with means
  # 0.48-0.78 apart while strangers sat at 0.00-0.12. Merging at 0.40 put
  # them back together (482 and 264) and left every other pair below 0.12.
  # The gap is wide, so anything from 0.35 to 0.45 gives the same answer.
  face_merge_cos: 0.40
  face_model: buffalo_l
  # Set true only where a CUDA device exists; the account this ran on had no
  # GPU quota at all and an 8-core CPU box was enough.
  face_gpu: false
  face_workers: 0

# S03.7 quality gate -- one curve per source class (spec section S03.7).
#
# max_exposure_pen is far above the spec's 0.15 / 0.20 / 0.35. Those were
# written before anyone had seen the corpus, and exposure_pen -- the share of
# pixels clipped at either end -- measures a scene's contrast range, not an
# exposure failure. At the spec's values the rule rejected 30 video shots,
# and every one of them was picture: 22 were talking-to-camera diary selfies
# with a white sky behind a correctly exposed face (the section 1.4 spine),
# three were a teahouse at night, two were Telegram round videos. The frames
# that are genuinely nothing -- five recordings shot inside a bag -- sit at
# 1.0. The ceiling now separates those from everything else and leaves
# "too much sky" to S05. For telegram it is off (1.0 can never be exceeded):
# the Act 1 material is screenshots -- the itinerary, the e-visa, the flight,
# the budget -- and a screenshot is white by nature. A blank one is caught
# by the sharpness floor, which is what blankness actually is.
quality_curves:
  camera:   {min_sharpness: 4.0, max_exposure_pen: 0.60, min_stability: 0.35, min_duration_s: 1.5}
  phone:    {min_sharpness: 3.5, max_exposure_pen: 0.60, min_stability: 0.30, min_duration_s: 1.5}
  telegram: {min_sharpness: 2.0, max_exposure_pen: 1.00, min_stability: 0.15, min_duration_s: 1.0}

# A shot carrying speech is judged on a floor of its own: the spec makes voice
# the spine of the film (section 1.4), and a soft frame under a good sentence is
# worth more than a sharp frame of nothing. Applied only where has_speech = 1.
gate:
  speech_sharpness_factor: 0.6
  speech_min_duration_s: 1.0

# Effort from the watch. The band that maps heart rate onto 0..1: rest is a
# fit adult at breakfast, the top is what the watch recorded on day one of
# this trek. Read by spine/effort.py and, later, by the S06 scene targets.
effort:
  hr_rest_bpm: 60
  hr_max_bpm: 170

semantic:
  max_caption_shots: 2500     # THE ONLY UNBOUNDED COST — spec section 8.1
  frames_per_caption: 4
  bedrock_model: null         # set at deploy time
  clip_model: ViT-L-14
  clip_pretrained: openai
  # CPU is a first-class path: the account this ran on had no GPU quota at all.
  # The claim that once stood here -- "ViT-L embeds this corpus in minutes on
  # eight cores" -- was never measured and is wrong. Measured on 4 cores:
  # 14.8 s/shot, i.e. 7 hours for 1,632 shots, and that was with torch
  # silently using 2 threads on a machine 6 GB into swap.
  clip_gpu: false
  clip_batch: 16
  # torch picks a thread count that is not the machine's core count. 0 = all.
  clip_threads: 0
  # ViT-L is ~6 hours of CPU on this corpus. Write the array every N shots so a
  # kill costs minutes, not the whole run; the index doubles as the resume point.
  clip_checkpoint_every: 64

score:
  tech:  {sharpness: 0.35, exposure: 0.25, stability: 0.30, duration_fit: 0.10}
  sem:   {vlm_interest: 0.60, clip_act_sim: 0.40}
  ctx:   {has_face: 0.25, has_speech: 0.20, new_max_alt: 0.20, first_at_place: 0.20, msg_proximity: 0.15}
  total: {tech: 0.40, sem: 0.35, ctx: 0.25}
  duration_fit_peak_s: [4.0, 8.0]
  shortlist_size: 400
  min_per_act: 40

assemble:
  mmr_lambda: 0.30
  max_shots_per_place_per_act: 3
  subject_shot_every_s: 40
  levity_min_per_act: 1        # acts 2-5, hard constraint
  # What a slot actually runs once the rhythm pass has cut it: measured
  # 2.3-2.7 s per slot across acts on the 2026-09-20 re-cut, because the
  # high band owns most of the film time and its 2 s cuts dominate. The
  # film is cut in count, not seconds -- a 15 s clip is used once, for this
  # long -- so this is what an act's material is worth, what a gap's refill
  # is budgeted at, and the length a refill is laid at before the rhythm
  # pass re-cuts it. Re-measure if `rhythm` changes.
  expected_slot_s: 2.5
  shot_duration_s:
    1: [3.0, 5.0]
    2: [4.0, 6.0]
    3: [3.0, 8.0]
    4: [2.0, 4.0]
    5: [5.0, 8.0]
  act4_held_shot_s: [6.0, 10.0]
  # A hard cut to silence needs room to land; three seconds is a gap, five is a
  # held breath.
  silence_window_s: 5.0
  # Music-out windows: no music at all, original audio at full level, placed at
  # the highest-exertion moments S05 finds. At -14 LUFS music with everything
  # ducked to -28 under it, location sound is inaudible for the whole runtime --
  # which throws away breathing at five thousand metres, wind, boots on scree.
  natural_sound_windows: 4
  natural_sound_window_s: [10.0, 20.0]
  max_reassembly_loops: 3
  # -- Film v2 section 4.3: assembly v2's alternation and rhythm rules --
  pair_window_s: 60
  pairs_per_act: 2
  max_consecutive_recording: 2   # outside a beat. The fill counts the run behind a pick;
                                 # the share repair counts both neighbours of the slot it
                                 # would swap, locked or not -- a run on screen is a run,
                                 # whatever placed the clips either side of it.
  source_alternation_after: 3    # soft: prefer another source after this many in a row
  source_share_min: 0.25         # of an act's phone slots, to each phone that has material
  long_take_s: [60, 90]
  long_take_keywords: ["мост", "мосту", "моста", "bridge", "suspension"]
  # When the similarity model (semantic.clip_model) has nothing to score --
  # the shortlist ran thin, or two shots are compared across a gap it was
  # never asked about -- these deterministic proxies stand in, ranked by how
  # much they imply "the same moment": literally adjacent, then the same
  # recording, then just the same place within the hour.
  similarity_fallback: {same_recording_60s: 1.0, same_recording: 0.6, same_place_hour: 0.3}
  rhythm:                        # section energy percentile -> slot length (s)
    low:  [5.0, 8.0]             # < 33
    mid:  [3.0, 5.0]             # 33-66
    high: [1.5, 2.5]             # > 66, cut on downbeats
    burst_slots: [8, 12]         # one beat each, on the act's highest swell
  chat_card_s: 4.0               # an Act 1 quote on screen
  closing_card_s: 6.0
  card_s: 3.0                    # the cold-open card
  # Film v2 section 6: a scene in one of these places during Act 1 or 5 is
  # "city", not trail, whatever its speed or altitude says -- Kathmandu sits
  # at 1,400 m and Pokhara has people walking at trekking pace through it.
  # Both spellings, because the gazetteer names places in Latin script and
  # the operator's captions name them in Cyrillic; matched case-insensitively.
  cities: [Kathmandu, Катманду, Pokhara, Покхара, Delhi, Дели]

render:
  draft: {width: 960, height: 540, crf: 23}
  # How far the rendered draft may sit from the timeline's own length before
  # the stage calls it a failed render. ffmpeg breaks out of its transcode
  # loop on a mid-graph error, writes a valid trailer and exits 0, so its exit
  # code cannot tell a finished film from one that stopped: 138.7 s of a
  # 2145.9 s draft came back "successful". Every leg is resampled to one rate,
  # so each one's length is quantised to a frame and the sum drifts slightly;
  # a render that stopped is short by slots, not by frames.
  draft_tol_s: 5.0
  # One rate for every leg of the concat. The proxies are 15 fps, the phones
  # 30 or 60, and a concat of mixed rates produced a 120 fps draft.
  fps: 30
  # 2026-09-24, Gate 3: location sound leads and the music sits under it --
  # the operator's "it's not messing up with some kind of other information"
  # is about level as much as about placement. Was -14.0; 3 dB down is the
  # difference between a bed you hear past and a bed you hear over. Act 4's
  # designed swell keeps the old level (music.placement.swell_lufs).
  music_lufs: -17.0            # the music bed
  duck_lufs: -28.0             # location audio under the bed
  duck_lufs_speech: -22.0      # music under speech
  # -- Film v2 section 6: the audio graph's own loudness targets, separate
  # from the three levels above (which govern the music bed against what
  # plays under it). These are per-track targets the mixer aims each cue at
  # before the final normalisation pass.
  speech_lufs: -16.0
  location_full_lufs: -18.0
  location_under_speech_lufs: -24.0
  music_xfade_s: 2.0
  window_fade_s: 1.0             # music out into a natural-sound window or the silence
  cue_fade_s: 0.15
  final_lufs: -14.0
  true_peak_db: -1.5
  audio_bitrate_k: 192

music:
  # Film v2 section 5.6: music is assigned per scene, not per act, so a track
  # can turn over inside a long act rather than being stuck with whichever cue
  # won the act's average.
  assignment: scene              # scene | act
  min_scene_s: 45                # a scene shorter than this is folded into a neighbour
  reuse_gap_s: 300                # a track cannot repeat within this many seconds of itself
  # Measured on the real corpus (2026-09-24, 31 scenes, 23 tracks): the most
  # any scene could gain by leaving the incumbent track was 0.36 and the
  # median 0.016, so a switch cost of 0.6 (plus 0.3 continuity) was never paid
  # and ONE track covered all 1814 s, looped eight times. Both must sit under
  # that margin; at 0.05 / 0.01 the same corpus uses 7 tracks with a longest
  # run of 743 s. Re-measure (music-assignment-diagnosis.md) if the targets
  # or the library change.
  switch_cost: 0.05               # penalty for changing track between adjacent scenes
  continuity_bonus: 0.01          # reward for keeping the same track across a cut
  repeat_penalty: 0.5             # extra cost for a track already used elsewhere in the film
  scene_targets:                  # weights of the distance terms
    energy: 1.0
    tempo: 0.6
    dynamics: 0.5
    brightness: 0.4
  # How long one piece may play before the film moves to another. Without a cap
  # a long track swallows its act -- a 9-minute one covered the whole 6.8-minute
  # Climb, leaving the centre of the film on a single cue while 19 other tracks
  # went unused. An act shorter than this stays in one piece, so Act 4 keeps the
  # unbroken swell into the silence that the brief asks for.
  max_segment_s: 150
  # The shortest piece a loop may be cut into. A run longer than what is left
  # of its track restarts the track rather than ask ffmpeg for audio the file
  # does not have, and the restart point is the cue the scene was assigned --
  # but sections have no minimum length and the cold open opens on Act 4's
  # swell, which is late in the piece by definition. A cue a third of a second
  # from the end would tile a 20 s need into sixty-odd sub-second pieces, each
  # with its own pair of fades clamped to nothing: flutter, and sixty more
  # inputs in the mix. Two crossfades of render.music_xfade_s (2 s) must fit
  # with music still audible between them. Under this, the loop runs from the
  # top of the track and the section cue is given up.
  loop_min_piece_s: 8
  license_mode: personal       # personal | cleared
  # Source of track features: audio files in music/, or a playlist export.
  # Audio is strictly better: it yields real beat grids and swells (which S06
  # needs to snap cuts) and real dynamic range, which Act 3's target leans on
  # and which no playlist export provides.
  source: audio                # audio | playlist | auto
  playlist_csv: null           # path; null means "the only .csv under music/"
  # To exclude a track, take it out of music/. The folder is the source of
  # truth; a name-matching filter here only risked dropping the wrong thing
  # (Aria, Pilot, Bravo, Kino and Husky are all names of unrelated bands).
  # Optional: drop tracks below this Spotify instrumentalness (playlist source
  # only -- an mp3 carries no such field). Off by default.
  min_instrumentalness: null
  # One track held back for the end credits (spec section S07.2). It is
  # withdrawn before the act assignment runs, not filtered out afterwards: left
  # in the pool it wins an act on its features, and that act is then scored
  # against a cue that will never play there. Matched on file name, stem or
  # title; a name that matches nothing is a warning, never a silent no-op.
  credits_track: "Marusha.Somewhere over the Rainbow.mp3"
  # The operator's own picks, WITHDRAWN at Gate 3 (2026-09-24, after watching
  # the first draft with sound): "Remove my previous requirement of using
  # four or five specific songs with high priority." The mechanism stays --
  # a bonus in the per-scene assignment (Film v2 section 5.6), never a rule:
  # it tilts a close call and cannot override a bad fit, matched on file name
  # or stem like credits_track -- it simply has nothing to prefer, so a later
  # operator can name tracks here without any code coming back.
  preferred_tracks: []
  # Zero while the list is empty, so nothing is silently tilted by a bonus
  # nobody asked for. Was 0.05, sized against the real corpus: the median
  # best-vs-third gap is 0.056, and 0.15 outweighed the whole available gain
  # in 24 of 31 scenes (same measurement as switch_cost above). That is the
  # number to restore if the list is ever filled again.
  preferred_bonus: 0.0
  # -- Gate 3 (2026-09-24): music is placed, not laid ---------------------
  # The operator, on the first draft with sound: "Constant music is a little
  # bit too much for this video, it doesn't match the vibe. Music should be
  # played only on those parts of the video where nothing else is spoken --
  # when it's appropriate, when it's not messing up with some kind of other
  # information. Definitely not from the start."
  # So a scene carries music only where nothing else carries information: no
  # speech beat, no chat or closing card, no natural-sound window, not the
  # cold open and not the film's first minute and a half. What is left over
  # groups into windows, and the map's segments tile those windows instead of
  # the acts.
  placement:
    # Asymmetric, because the two edges do different jobs (operator,
    # 2026-09-24): the bed must be out of the way before a line starts, and
    # it must let the line land before coming back. Two seconds of run-out,
    # four of silence after -- a cue returning on the last syllable is the
    # "messing up with some kind of other information" the ruling names.
    speech_margin_before_s: 2.0
    speech_margin_after_s: 4.0
    # A window shorter than this is dropped rather than filled: a sting under
    # nothing arrives, states nothing and leaves. 30 -> 60 with
    # max_windows_per_act below: one arc per act, not a scattering of cues
    # (operator, 2026-09-24).
    min_window_s: 60
    # At most this many windows in an act, the rest left on ambience. Two is
    # "one arc per act" with room for a reprise; act 5 takes one, which
    # resolves into the credits instead of returning.
    max_windows_per_act: 2
    max_windows_by_act: {5: 1}
    # Which acts keep their LAST eligible window rather than their longest:
    # act 5 is the descent and the return, and its one cue belongs as late as
    # eligibility allows, running into the credits (operator, 2026-09-24).
    prefer_late_acts: [5]
    # Music enters on movement, never on talk or rest (operator,
    # 2026-09-24). These are spine/scenes.py's own activity classes, not new
    # ones: walking, climbing, descending and crossing are the trek moving,
    # and summit is act 4's push. What is left out is what the ruling means
    # by rest -- resting, village and city (a tea-house stop, a meal, a
    # lodge) and transport (sitting in a jeep). A window may only OPEN on one
    # of these; once the cue is established any class may lie inside it.
    enter_on: [walking, climbing, descending, crossing, summit]
    # An arrival is where the trail flattens after a climb -- the pass, the
    # viewpoint, the village reached. A window opening on one is kept ahead
    # of a merely longer window when an act has more than it may keep
    # (operator, 2026-09-24: the climb before it stays silent, the arrival
    # gets the cue). Read off the scene's own duration-weighted gain.
    arrival_gain_m_per_h: 100
    climb_gain_m_per_h: 300
    # "Definitely not from the start." The cold open, the opening card and
    # Act 1's first chat cards play on location sound alone; 90 s is what
    # those take at assemble.card_s + assemble.chat_card_s apiece.
    no_music_before_s: 90
    # Outside a window the rhythm pass still needs a section to time its cuts
    # against, and a section is nothing but an energy band. "low" is the
    # band whose holds are longest (see assemble.rhythm): with no bed under
    # it the cut breathes instead of inheriting the pace of music that is not
    # playing. A key, not a literal, because it is a judgement about the
    # film's pace and the next draft may want "mid".
    no_music_band: low
    # Act 4 is one swell into a hard cut to silence -- the brief's single
    # most powerful move -- so it keeps the level the whole film had before
    # 2026-09-24 put the bed under the location sound. The rest of the film
    # plays at render.music_lufs.
    swell_lufs: -14.0
    # No one piece may hold the film longer than this without a break
    # (operator, 2026-09-24, after one track ran 1814 s unbroken). The
    # recalibrated switch_cost/continuity_bonus above cut the longest run to
    # 743 s, which is still a quarter of an hour on one cue. Hard, not a
    # cost: the assignment may not extend a run past it, and the run resets
    # at a window boundary and at every switch.
    max_track_run_s: 240

# Remote execution (Film v2 section 2.2). The local machine computes nothing;
# everything runs on one GCP Spot VM with the bucket as the hub.
cloud:
  provider: gcp
  # Hard ceiling on what the pipeline may spend, in USD, across API calls and
  # VM hours as the ledger (work/reports/spend.json) records them. The
  # operator approved 15 on 2026-09-16, raised it to 25 on 2026-09-18 when the
  # CPU box went on-demand, and to 45 on 2026-09-24 after a session ended
  # without `remote down` and the box billed 104 idle hours (~31 USD): the
  # ledger only books box time at `down`, so `remote status` read 5.21 for
  # four days while the meter ran. The GCP billing budget is 60 and alerts at
  # 50% and 80%, but that is a warning, this is a refusal.
  spend_ceiling_usd: 45
  gcp:
    gcloud: ~/google-cloud-sdk/bin/gcloud
    project: nepalvideo
    region: europe-west4
    zone: europe-west4-a
    bucket: gs://nepalvideo-29922345852
    # The branch the box checks out. The box always resets to origin/<branch>,
    # so push before `nepal remote run`.
    branch: worktree-film-v2-design
    repo: https://github.com/kirtom/nepalvideo.git
    # Two profiles: everything that is CPU, and the GPU minutes. Spot prices
    # in europe-west4 as of 2026-09-18, for the ledger's estimate only -- the
    # bill is what GCP says it is.
    profiles:
      # On-demand, by the operator's call (2026-09-18): Spot took the box back
      # in the middle of a twenty-minute faces pass, and the CPU box runs the
      # long unattended chains. About three times the Spot price, ~$12 more
      # over the project; the ledger ceiling went from 15 to 25 for it.
      cpu:
        name: nepal-cpu
        machine_type: e2-standard-8
        # raw/ alone is 69 GB once the camera originals landed in the bucket,
        # and every run rsyncs it onto this disk: at 60 GB cloud-init died
        # with ENOSPC at boot and ssh keys were never written (2026-09-20).
        disk_gb: 150
        image_family: ubuntu-2204-lts
        image_project: ubuntu-os-cloud
        accelerator: null
        spot: false
        usd_per_h: 0.30
      gpu:
        name: nepal-gpu
        machine_type: g2-standard-4
        disk_gb: 150                # same rsync of raw/, same reason as cpu
        image_family: ubuntu-2204-lts
        image_project: ubuntu-os-cloud
        accelerator: nvidia-l4
        spot: true
        usd_per_h: 0.30
    # Where the box keeps things: the same paths the config names, so
    # pipeline.yaml needs no change on the box.
    remote_data_root: /data/projects/nepal_data
    remote_work_root: /data/projects/nepal_work
    remote_repo: /data/projects/nepalvideo
    # The box's user, who owns the checkout and the data; ssh logs in as it.
    ssh_user: nepal
    # How long `up` waits for the startup script to write its READY marker.
    ready_timeout_s: 1500
    # The box stops itself after this many minutes with no job running and
    # nothing written to a job log. On 2026-09-20 a session died on a rate
    # limit with the box up and nothing stopped it for four days: 104 idle
    # hours, ~31 USD, through a ceiling of 25. The session is what failed, so
    # the timer runs on the box. Thirty minutes is long enough to read a
    # render and decide what to do next, short enough that a box nobody comes
    # back to costs cents rather than a day's budget.
    idle_stop_min: 30
    # How often the watchdog looks. A sixth of the timeout: the cost of a
    # tick is a process list and three stat calls, and the cost of a coarse
    # one is billed minutes.
    idle_check_min: 5
    # A job process that has written nothing for this long is wedged, not
    # working, and the box stops anyway. S03.1 is the longest run here --
    # three and a half hours -- and it logs per recording, so four hours of
    # silence is not a stage taking its time. Without this bound a hung
    # process is an unbounded bill with a reassuring explanation.
    stuck_job_min: 240

# -- S03.5b the hallucination filter (Film v2 section 4.1) ------------------
# Whisper invents text where there is none to hear: subtitle credits, "thanks
# for watching", one phrase looped. Every rule here is deterministic and cheap,
# so the filter is re-run on every S03 pass and the transcripts are never
# re-made for it. no_speech_prob and compression_ratio are what faster-whisper
# reports per segment; transcripts made before those were stored fall through
# to the phrase and repetition rules alone.
asr:
  hallucination_phrases:
    - "Субтитры сделал"
    - "Субтитры создавал"
    - "DimaTorzok"
    - "Продолжение следует"
    - "Редактор субтитров"
    - "Спасибо за просмотр"
    - "Подписывайтесь"
    - "Корректор"
  max_no_speech_prob: 0.6
  max_compression_ratio: 2.4
  # the same n-gram this many times inside one segment is a loop, not speech
  ngram_n: 3
  ngram_min_repeats: 3
  # Word-level times let a beat start and end on a word rather than on the
  # segment whisper happened to draw -- which, at 20 s a shot and no previous
  # text to condition on, is usually the whole shot.
  word_timestamps: true

# -- S04.5 the beat sheet (Film v2 section 4.2) -----------------------------
beats:
  model: claude-opus-5
  effort: high                 # low | medium | high | xhigh | max
  # A backstop, not a budget: thinking counts against it, and the first
  # live call spent all of a 16000 cap thinking about 140k tokens of prompt
  # and was cut off with no sheet. Opus 5 streams up to 128k; 64k is the
  # documented setting for long work. It bounds the estimate, not the bill.
  max_output_tokens: 64000
  # what the prompt states and the validator enforces
  min_speech_beats: 10
  max_speech_beats: 16
  max_speech_s: 25
  min_act1_quotes: 4
  max_act1_quotes: 8
  max_act4_beats: 1
  max_pairs: 5
  # a cut point must sit on a segment or word boundary this close
  cut_tolerance_s: 0.05
  # a time this close to a cut point is a rounding and is snapped onto it
  snap_s: 0.5
  title_max_chars: 80
  # one more call with the validator's complaints, then give up
  retries: 1
  # the two refusals before any money is spent
  max_input_tokens: 200000
  estimate_usd_cap: 3.0
  # for the dry run on a machine without the SDK: Cyrillic runs about three
  # characters a token; the live call counts for real before it spends
  estimate_chars_per_token: 3.0
  # long messages are clipped in the prompt; a card is 180 characters anyway
  chat_max_chars: 500
  # -- Film v2 section 4.4: placing picture against the voice spine --
  face_hold_s: 2.5               # the speaker's own shot before B-roll takes over
  pre_roll_s: 0.4                # picture cuts this much before the utterance starts
  broll_window_s: 7200           # B-roll candidates within +-2 h of the beat, same act
  own_picture_face_score_below: 0.35   # below this the beat is a walking shot: picture stays

# -- the API, priced ---------------------------------------------------------
# USD per million tokens, for the estimate before the call and the ledger
# entry after it. The key is never here: ANTHROPIC_API_KEY in the environment,
# which on the box the bootstrap fills from instance metadata.
api:
  prices_usd_per_mtok:
    claude-opus-5:   {input: 5.0,  output: 25.0}
    claude-sonnet-5: {input: 2.0,  output: 10.0}
    claude-haiku-4-5: {input: 1.0, output: 5.0}
